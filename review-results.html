  const $ = id => document.getElementById(id);
  const viewport = $('viewport'), stage = $('stage'), picker = $('image-select');
  let images = [], photo, scale = 1, fitMode = true, request = 0, view = 'checks';

  // All data is rendered as text, including raw JSON and accepted phrases.
  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  async function readJSON(path) {
    return (await fetch(path, {cache: 'no-store'})).json();
  }
  function canonical(value) {
    if (Array.isArray(value)) return value.map(canonical);
    if (value && typeof value === 'object') return Object.fromEntries(
      Object.keys(value).sort().map(key => [key, canonical(value[key])])
    );
    return value;
  }
  function resultFor(track, solution, imageId, check) {
    const saved = results[track][solution][imageId]?.find(row => row.test.id === check.id);
    return saved && JSON.stringify(canonical(saved.test)) === JSON.stringify(canonical(check))
      ? saved.pass : null;
  }
  function comparison(track, imageId, check, schema) {
    const personal = track === 'parse' ? 'lighton' : 'luna-jev';
    const schemaMatches = track === 'parse' || JSON.stringify(canonical(schemas[imageId])) === JSON.stringify(canonical(schema));
    const statuses = schemaMatches
      ? [resultFor(track, 'datalab', imageId, check), resultFor(track, personal, imageId, check)] : [null, null];
    const kind = statuses.includes(null) ? 'unknown'
      : statuses.every(Boolean) ? 'both-pass'
      : statuses.every(value => !value) ? 'both-fail' : 'split';
    return {statuses, kind};
  }
  function renderResults(statuses, track) {
    const row = element('div', undefined, 'results');
    const labels = ['Datalab', track === 'parse' ? 'LightOn' : 'Luna/Jev'];
    statuses.forEach((status, index) => {
      const label = status === null ? '— Check changed / no result' : status ? '✓ Pass' : '✕ Fail';
      row.append(element('span', `${labels[index]}: ${label}`, `badge ${status === null ? 'unknown' : status ? 'pass' : 'fail'}`));
    });
    return row;
  }
  function renderSummary(comparisons, track) {
    const row = element('div', undefined, 'results');
    for (const [kind, label, color] of [['both-pass', 'Both pass', 'pass'], ['split', 'Disagree', 'split-label'], ['both-fail', 'Both fail', 'fail'], ['unknown', 'Changed / missing', 'unknown']]) {
      const count = comparisons.filter(item => item.kind === kind).length;
      if (count) row.append(element('span', `${label}: ${count}`, `badge ${color}`));
    }
    $('results-summary').replaceChildren(row, element('div',
      `Saved-output snapshot · Datalab accurate vs ${track === 'parse' ? 'LightOn' : 'LightOn → Luna/Jev'} · Changed checks show gray.`, 'muted'));
  }
  function renderCheck(check, schema, result, track) {
    const card = element('article'), body = element('div', undefined, 'check-body');
    card.classList.add(result.kind);
    body.append(renderResults(result.statuses, track));
    const order = check.type === 'order';
    const meta = element('div', undefined, 'check-meta');
    if (schema) {
      const spec = schema.properties[check.field];
      meta.append(element('span', `${spec.type[0]} · ${check.basis}`, 'kind'));
      body.append(meta, element('p', check.field, 'phrase'), element('p', spec.description, 'rule'));
      body.append(element('p', check.alternatives ? 'Must equal this value or an accepted alternative.' : 'Must equal this value.', 'rule'));
      body.append(element('pre', JSON.stringify(check.expected), 'expected'));
      if (check.alternatives) {
        const aliases = element('details', undefined, 'alternatives');
        aliases.append(element('summary', 'Accepted alternatives'), element('pre', JSON.stringify(check.alternatives, null, 2)));
        body.append(aliases);
      }
    } else {
      const groups = (order ? check.sequence : check.contains_all).map(group => group.any_of);
      meta.append(element('span', order ? 'Reading order' : 'Text', 'kind'));
      body.append(meta);
      body.append(element('p', order
        ? 'All snippets must appear in this order. Other text may occur between them.'
        : groups.length > 1 ? 'All groups below are required. Any alternative within a group is accepted.'
        : groups[0].length > 1 ? 'Must contain this text or one of its accepted alternatives.'
        : 'Must contain this text.', 'rule'));
      const expected = element(order ? 'ol' : 'div', undefined, 'expected');
      for (const aliases of groups) {
        const group = element(order ? 'li' : 'div', undefined, 'group');
        group.append(element('div', aliases[0], 'phrase'));
        if (aliases.length > 1) {
          const details = element('details', undefined, 'alternatives');
          details.append(element('summary', `${aliases.length - 1} accepted alternative${aliases.length > 2 ? 's' : ''}`));
          const list = element('ul');
          aliases.slice(1).forEach(alias => list.append(element('li', alias, 'phrase')));
          details.append(list); group.append(details);
        }
        expected.append(group);
      }
      body.append(expected);

      readJSON(folder + (extraction ? 'extract_tests.json' : 'parse_tests.json')),

    $('file-json').textContent = JSON.stringify(data, null, 2);
    $('schema-json').textContent = schema ? JSON.stringify(schema, null, 2) : '';
    $('checks-pane').scrollTop = 0; setView(view);
    const url = new URL(location.href);
    if (extraction) url.searchParams.set('track', 'extract'); else url.searchParams.delete('track');
    url.hash = item.id;

  }
  picker.onchange = loadImage;
  $('track').value = new URLSearchParams(location.search).get('track') === 'extract' ? 'extract' : 'parse';
  $('track').onchange = loadImage;
  $('previous').onclick = () => { picker.value = Number(picker.value) - 1; loadImage(); };
  $('next').onclick = () => { picker.value = Number(picker.value) + 1; loadImage(); };
  $('fit').onclick = () => zoom(1, true);
  $('actual').onclick = () => zoom(1);
  $('zoom-in').onclick = () => zoom(scale * 1.4);
  $('zoom-out').onclick = () => zoom(scale / 1.4);
  $('show-checks').onclick = () => setView('checks');
  $('show-json').onclick = () => setView('json');
  $('show-schema').onclick = () => setView('schema');
  new ResizeObserver(() => zoom(scale, fitMode)).observe(viewport);
  let drag;
  viewport.onpointerdown = event => {
    if (event.pointerType !== 'mouse' || event.button !== 0 || !photo) return;
    drag = [event.clientX, event.clientY, viewport.scrollLeft, viewport.scrollTop];
    viewport.setPointerCapture(event.pointerId); viewport.classList.add('dragging');

    if (!drag) return;
    viewport.scrollLeft = drag[2] - event.clientX + drag[0];

    images = await readJSON('images.json');
    images.forEach((item, index) => picker.add(new Option(`${item.id} · ${item.title}`, index)));
